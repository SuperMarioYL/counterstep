<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="sc-d-t sc-d-d"><title id="sc-d-t">Counterstep scene</title><desc id="sc-d-d">Illustrative still: a destructive call is held by the counterstep hook while its inverse is fingerprint-checked and rehearsed, then armed in the ledger.</desc>
<defs>
<linearGradient id="sc-d-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e6d7"/><stop offset="0.55" stop-color="#6ab1e7"/><stop offset="1" stop-color="#acf6d4"/></linearGradient>
<radialGradient id="sc-d-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#56e6d7" stop-opacity="0.16"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient>
<filter id="sc-d-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="sc-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6d7" stroke-width="1.6"/></marker>
<marker id="sc-d-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9c1" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.sc-d-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style>
<rect width="1200" height="640" rx="16" fill="#050c11"/>
<rect width="1200" height="640" rx="16" fill="url(#sc-d-halo)"/>
<pattern id="sc-d-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#173c3d" stroke-opacity="0.3" stroke-width="0.6"/></pattern>
<rect width="1200" height="640" rx="16" fill="url(#sc-d-grid)"/>
<rect x="430" y="96" width="340" height="62" rx="31" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><text x="600" y="122" fill="#56e6d7" font-size="14" font-weight="600" opacity="1" text-anchor="middle">sha256 fingerprint — pre-action state</text><text x="600" y="144" fill="#95b9c1" font-size="12" font-weight="600" opacity="1" text-anchor="middle">fs scope · remote ref read from the remote</text><path d="M600 158 L600 208" fill="none" stroke="#56e6d7" stroke-width="1.4" marker-end="url(#sc-d-arrow)"/><rect x="60" y="240" width="268" height="120" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="80" y="270" fill="#eefdf6" font-size="15" font-weight="700" opacity="1">coding agent</text><text x="80" y="296" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" class="sc-d-mono">rm -rf src/legacy</text><text x="80" y="318" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" class="sc-d-mono">git push --force origin main</text><text x="80" y="342" fill="#6ab1e7" font-size="11.5" font-weight="600" opacity="1" class="sc-d-mono">PreToolUse · stdin JSON</text><rect x="452" y="208" width="296" height="120" rx="16" fill="#0c171e" stroke="url(#sc-d-brand)" stroke-width="2" filter="url(#sc-d-glow)"/><text x="600" y="246" fill="#eefdf6" font-size="19" font-weight="700" opacity="1" text-anchor="middle">counterstep hook</text><text x="600" y="272" fill="#56e6d7" font-size="13.5" font-weight="600" opacity="1" text-anchor="middle">deny until armed</text><text x="600" y="296" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">classify · construct inverse · rehearse</text><text x="600" y="314" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">one process per call</text><rect x="300" y="470" width="280" height="96" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="320" y="500" fill="#eefdf6" font-size="14.5" font-weight="700" opacity="1">shadow copy — rehearsal</text><text x="320" y="524" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">inverse applied to a copy of the</text><text x="320" y="542" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">scope; fingerprint must restore</text><path d="M540 328 C500 380, 450 420, 440 470" fill="none" stroke="#56e6d7" stroke-width="1.4" marker-end="url(#sc-d-arrow)"/><rect x="640" y="470" width="320" height="96" rx="12" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><text x="660" y="500" fill="#56e6d7" font-size="14.5" font-weight="700" opacity="1" class="sc-d-mono">.counterstep/ledger.jsonl</text><text x="660" y="524" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">armed inverses with verified fingerprints</text><text x="660" y="542" fill="#6ab1e7" font-size="12" font-weight="600" opacity="1" class="sc-d-mono">counterstep fire --last → undo, re-verified</text><path d="M660 328 C700 380, 740 420, 760 470" fill="none" stroke="#56e6d7" stroke-width="1.4" marker-end="url(#sc-d-arrow)"/><rect x="916" y="240" width="224" height="120" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="936" y="270" fill="#acf6d4" font-size="15" font-weight="700" opacity="1">call released</text><text x="936" y="296" fill="#95b9c1" font-size="12" font-weight="600" opacity="1" class="sc-d-mono">fs_restore · git_push_ref</text><text x="936" y="318" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">armed before the forward</text><text x="936" y="336" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">call runs</text><path d="M748 268 L916 268" fill="none" stroke="#56e6d7" stroke-width="1.4" marker-end="url(#sc-d-arrow)"/><path d="M328 300 L452 268" fill="none" stroke="#56e6d7" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#sc-d-arrow)" class="sc-d-flow"/><circle cx="372" cy="288" r="2.6" fill="#56e6d7" opacity="0.6"/><circle cx="404" cy="280" r="2" fill="#56e6d7" opacity="0.45"/><circle cx="200" cy="140" r="2.2" fill="#56e6d7" opacity="0.35"/><circle cx="268" cy="108" r="3" fill="#56e6d7" opacity="0.5"/><circle cx="352" cy="150" r="2.2" fill="#56e6d7" opacity="0.35"/><circle cx="166" cy="220" r="2.6" fill="#56e6d7" opacity="0.45"/><circle cx="246" cy="196" r="2.2" fill="#56e6d7" opacity="0.3"/><circle cx="900" cy="120" r="2.6" fill="#56e6d7" opacity="0.45"/><circle cx="986" cy="168" r="2.2" fill="#56e6d7" opacity="0.35"/><circle cx="1054" cy="110" r="3" fill="#56e6d7" opacity="0.5"/><circle cx="1108" cy="210" r="2.2" fill="#56e6d7" opacity="0.35"/><circle cx="836" cy="96" r="2.2" fill="#56e6d7" opacity="0.3"/><circle cx="560" cy="92" r="2.4" fill="#56e6d7" opacity="0.4"/><circle cx="660" cy="120" r="2" fill="#56e6d7" opacity="0.3"/><circle cx="96" cy="420" r="2.4" fill="#56e6d7" opacity="0.4"/><circle cx="140" cy="520" r="2" fill="#56e6d7" opacity="0.3"/><circle cx="1080" cy="470" r="2.6" fill="#56e6d7" opacity="0.45"/><circle cx="1128" cy="560" r="2.2" fill="#56e6d7" opacity="0.35"/><circle cx="1010" cy="540" r="2" fill="#56e6d7" opacity="0.3"/><circle cx="620" cy="590" r="2.2" fill="#56e6d7" opacity="0.3"/><circle cx="520" cy="560" r="2" fill="#56e6d7" opacity="0.3"/><text x="600" y="606" fill="#95b9c1" font-size="13" font-weight="500" opacity="1" text-anchor="middle">Counterstep — the rehearsed undo ledger</text>
</svg>
