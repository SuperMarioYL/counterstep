<svg xmlns="http://www.w3.org/2000/svg" width="640" height="970" viewBox="0 0 640 970" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="im-d-t im-d-d"><title id="im-d-t">Counterstep invertibility</title><desc id="im-d-d">Classification of the destructive call surface, narrow composition: fifteen armed inverses, twelve blocked with reasons, fourteen not yet intercepted.</desc>
<defs>
<linearGradient id="im-d-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e6d7"/><stop offset="0.55" stop-color="#6ab1e7"/><stop offset="1" stop-color="#acf6d4"/></linearGradient>
<radialGradient id="im-d-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#56e6d7" stop-opacity="0.16"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient>
<filter id="im-d-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="im-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6d7" stroke-width="1.6"/></marker>
<marker id="im-d-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9c1" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.im-d-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.im-d-flow{animation:im-d-fdash 5.5s linear infinite}@keyframes im-d-fdash{to{stroke-dashoffset:-190}}.im-d-pulse{animation:im-d-fpulse 4.2s ease-in-out infinite}@keyframes im-d-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="640" height="970" rx="16" fill="#050c11"/>
<rect width="640" height="970" rx="16" fill="url(#im-d-halo)"/>
<pattern id="im-d-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#173c3d" stroke-opacity="0.3" stroke-width="0.6"/></pattern>
<rect width="640" height="970" rx="16" fill="url(#im-d-grid)"/>
<text x="36" y="44" fill="#eefdf6" font-size="23" font-weight="700" opacity="1">What the ledger can and cannot undo</text><text x="36" y="68" fill="#95b9c1" font-size="13.5" font-weight="400" opacity="1">Classified against the implemented mechanism · docs/invertibility.md</text><rect x="36" y="100" width="568" height="268" rx="12" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><rect x="36" y="100" width="4" height="268" rx="2" fill="#56e6d7"/><text x="56" y="132" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Class A — intercepted &amp; invertible</text><text x="56" y="154" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">armed, then allowed</text><rect x="526" y="114" width="58" height="30" rx="15" fill="#0c171e" stroke="#56e6d7" stroke-width="1.2"/><text x="555" y="134" fill="#56e6d7" font-size="14" font-weight="700" opacity="1" text-anchor="middle" class="im-d-mono">15</text><g><rect x="56" y="172" width="86.96" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="186" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">rm &lt;file&gt;</text></g><g><rect x="152.95999999999998" y="172" width="109.28" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="162.95999999999998" y="186" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">rm -rf &lt;dir&gt;</text></g><g><rect x="272.24" y="172" width="176.24" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="282.24" y="186" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">mv (rename / clobber)</text></g><g><rect x="56" y="206" width="183.68" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="220" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">Write / Edit overwrite</text></g><g><rect x="249.68" y="206" width="198.56" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="259.68" y="220" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">MultiEdit / NotebookEdit</text></g><g><rect x="56" y="240" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="254" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git push --force</text></g><g><rect x="205.04" y="240" width="258.08" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="215.04" y="254" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git push -f / --force-with-lease</text></g><g><rect x="56" y="274" width="198.56" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="288" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">push :&lt;ref&gt; (ref delete)</text></g><text x="56" y="322" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">inverse: fs_restore from the shadow snapshot · git_push_ref back to the armed</text><text x="56" y="339" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">  sha</text><rect x="36" y="392" width="568" height="268" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><rect x="36" y="392" width="4" height="268" rx="2" fill="#173c3d"/><text x="56" y="424" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Class B — intercepted, blocked</text><text x="56" y="446" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">the reason is stated in the denial</text><rect x="526" y="406" width="58" height="30" rx="15" fill="#0c171e" stroke="#56e6d7" stroke-width="1.2"/><text x="555" y="426" fill="#56e6d7" font-size="14" font-weight="700" opacity="1" text-anchor="middle" class="im-d-mono">12</text><g><rect x="56" y="464" width="153.92" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="478" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">rm -f *.log (glob)</text></g><g><rect x="219.92" y="464" width="176.24" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="229.92" y="478" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">outside the workspace</text></g><g><rect x="406.15999999999997" y="464" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="416.15999999999997" y="478" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">rm .counterstep/</text></g><g><rect x="56" y="498" width="235.76" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="512" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git push --force (no refspec)</text></g><g><rect x="301.76" y="498" width="168.8" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="311.76" y="512" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">push to a new branch</text></g><g><rect x="56" y="532" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="546" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git reset --hard</text></g><g><rect x="205.04" y="532" width="191.12" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="215.04" y="546" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">curl -X POST/PUT/DELETE</text></g><g><rect x="406.15999999999997" y="532" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="416.15999999999997" y="546" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">wget --post-file</text></g><g><rect x="56" y="566" width="109.28" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="580" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">httpie verbs</text></g><text x="56" y="614" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">what the shell expands, whole-repo discards and third-party writes admit no</text><text x="56" y="631" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">  scoped, rehearsal-verifiable inverse</text><rect x="36" y="684" width="568" height="234" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><rect x="36" y="684" width="4" height="234" rx="2" fill="#173c3d"/><text x="56" y="716" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Class C — not yet intercepted</text><text x="56" y="738" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">the v0.2 backlog, one oracle at a time</text><rect x="526" y="698" width="58" height="30" rx="15" fill="#0c171e" stroke="#56e6d7" stroke-width="1.2"/><text x="555" y="718" fill="#56e6d7" font-size="14" font-weight="700" opacity="1" text-anchor="middle" class="im-d-mono">14</text><g><rect x="56" y="756" width="116.72" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="770" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git clean -fd</text></g><g><rect x="182.72" y="756" width="235.76" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="192.72" y="770" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git checkout -- / git restore</text></g><g><rect x="56" y="790" width="168.8" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="804" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">&gt; file (redirection)</text></g><g><rect x="234.8" y="790" width="109.28" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="244.8" y="804" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">find -delete</text></g><g><rect x="354.08000000000004" y="790" width="79.52" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="364.08000000000004" y="804" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">truncate</text></g><g><rect x="443.6" y="790" width="116.72" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="453.6" y="804" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">git branch -D</text></g><g><rect x="56" y="824" width="101.84" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="838" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">npm publish</text></g><g><rect x="167.84" y="824" width="124.16" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="177.84" y="838" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">kubectl delete</text></g><g><rect x="302" y="824" width="146.48000000000002" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="312" y="838" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="im-d-mono">terraform destroy</text></g><text x="56" y="872" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">runs through the harness's normal permission flow — documented so the gap is</text><text x="56" y="889" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">  explicit, never implied</text><text x="320" y="946" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" text-anchor="middle">blocked is not denied forever — every refusal carries its reason</text>
</svg>
