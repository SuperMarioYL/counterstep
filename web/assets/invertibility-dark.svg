<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="753" viewBox="0 0 1150 753" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="iv-d-t iv-d-d"><title id="iv-d-t">Counterstep invertibility</title><desc id="iv-d-d">Classification of the destructive call surface: fifteen ops arm verified inverses, twelve are blocked with the reason stated, and fourteen are not yet intercepted and form the v0.2 backlog.</desc>
<defs>
<linearGradient id="iv-d-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e6d7"/><stop offset="0.55" stop-color="#6ab1e7"/><stop offset="1" stop-color="#acf6d4"/></linearGradient>
<radialGradient id="iv-d-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#56e6d7" stop-opacity="0.16"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient>
<filter id="iv-d-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="iv-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6d7" stroke-width="1.6"/></marker>
<marker id="iv-d-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9c1" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.iv-d-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.iv-d-flow{animation:iv-d-fdash 5.5s linear infinite}@keyframes iv-d-fdash{to{stroke-dashoffset:-190}}.iv-d-pulse{animation:iv-d-fpulse 4.2s ease-in-out infinite}@keyframes iv-d-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="1150" height="753" rx="16" fill="#050c11"/>
<rect width="1150" height="753" rx="16" fill="url(#iv-d-halo)"/>
<pattern id="iv-d-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#173c3d" stroke-opacity="0.3" stroke-width="0.6"/></pattern>
<rect width="1150" height="753" rx="16" fill="url(#iv-d-grid)"/>
<text x="40" y="46" fill="#eefdf6" font-size="23" font-weight="700" opacity="1">What the ledger can and cannot undo</text><text x="40" y="70" fill="#95b9c1" font-size="13.5" font-weight="400" opacity="1">The destructive call surface, classified against the implemented mechanism · docs/invertibility.md</text><rect x="40" y="104" width="1070" height="183" rx="12" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><rect x="40" y="104" width="4" height="183" rx="2" fill="#56e6d7"/><text x="60" y="136" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Class A — intercepted &amp; invertible</text><text x="60" y="158" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">armed, then allowed</text><rect x="1032" y="118" width="58" height="30" rx="15" fill="#0c171e" stroke="#56e6d7" stroke-width="1.2"/><text x="1061" y="138" fill="#56e6d7" font-size="14" font-weight="700" opacity="1" text-anchor="middle" class="iv-d-mono">15</text><g><rect x="60" y="176" width="86.96" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="70" y="190" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">rm &lt;file&gt;</text></g><g><rect x="156.95999999999998" y="176" width="109.28" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="166.95999999999998" y="190" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">rm -rf &lt;dir&gt;</text></g><g><rect x="276.24" y="176" width="176.24" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="286.24" y="190" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">mv (rename / clobber)</text></g><g><rect x="462.48" y="176" width="183.68" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="472.48" y="190" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">Write / Edit overwrite</text></g><g><rect x="656.1600000000001" y="176" width="198.56" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="666.1600000000001" y="190" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">MultiEdit / NotebookEdit</text></g><g><rect x="864.72" y="176" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="874.72" y="190" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git push --force</text></g><g><rect x="60" y="210" width="258.08" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="70" y="224" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git push -f / --force-with-lease</text></g><g><rect x="328.08" y="210" width="198.56" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="338.08" y="224" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">push :&lt;ref&gt; (ref delete)</text></g><text x="60" y="258" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">inverse: fs_restore from the shadow snapshot · git_push_ref back to the armed sha</text><rect x="40" y="311" width="1070" height="183" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><rect x="40" y="311" width="4" height="183" rx="2" fill="#173c3d"/><text x="60" y="343" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Class B — intercepted, blocked</text><text x="60" y="365" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">the reason is stated in the denial</text><rect x="1032" y="325" width="58" height="30" rx="15" fill="#0c171e" stroke="#56e6d7" stroke-width="1.2"/><text x="1061" y="345" fill="#56e6d7" font-size="14" font-weight="700" opacity="1" text-anchor="middle" class="iv-d-mono">12</text><g><rect x="60" y="383" width="153.92" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="70" y="397" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">rm -f *.log (glob)</text></g><g><rect x="223.92" y="383" width="176.24" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="233.92" y="397" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">outside the workspace</text></g><g><rect x="410.15999999999997" y="383" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="420.15999999999997" y="397" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">rm .counterstep/</text></g><g><rect x="559.1999999999999" y="383" width="235.76" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="569.1999999999999" y="397" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git push --force (no refspec)</text></g><g><rect x="804.9599999999999" y="383" width="168.8" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="814.9599999999999" y="397" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">push to a new branch</text></g><g><rect x="60" y="417" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="70" y="431" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git reset --hard</text></g><g><rect x="209.04" y="417" width="191.12" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="219.04" y="431" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">curl -X POST/PUT/DELETE</text></g><g><rect x="410.15999999999997" y="417" width="139.04" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="420.15999999999997" y="431" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">wget --post-file</text></g><g><rect x="559.1999999999999" y="417" width="109.28" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="569.1999999999999" y="431" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">httpie verbs</text></g><text x="60" y="465" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">what the shell expands, whole-repo discards and third-party writes admit no scoped, rehearsal-verifiable inverse</text><rect x="40" y="518" width="1070" height="183" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><rect x="40" y="518" width="4" height="183" rx="2" fill="#173c3d"/><text x="60" y="550" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Class C — not yet intercepted</text><text x="60" y="572" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">the v0.2 backlog, one oracle at a time</text><rect x="1032" y="532" width="58" height="30" rx="15" fill="#0c171e" stroke="#56e6d7" stroke-width="1.2"/><text x="1061" y="552" fill="#56e6d7" font-size="14" font-weight="700" opacity="1" text-anchor="middle" class="iv-d-mono">14</text><g><rect x="60" y="590" width="116.72" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="70" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git clean -fd</text></g><g><rect x="186.72" y="590" width="235.76" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="196.72" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git checkout -- / git restore</text></g><g><rect x="432.48" y="590" width="168.8" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="442.48" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">&gt; file (redirection)</text></g><g><rect x="611.28" y="590" width="109.28" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="621.28" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">find -delete</text></g><g><rect x="730.56" y="590" width="79.52" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="740.56" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">truncate</text></g><g><rect x="820.0799999999999" y="590" width="116.72" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="830.0799999999999" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">git branch -D</text></g><g><rect x="946.8" y="590" width="101.84" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="956.8" y="604" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">npm publish</text></g><g><rect x="60" y="624" width="124.16" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="70" y="638" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">kubectl delete</text></g><g><rect x="194.16" y="624" width="146.48000000000002" height="26" rx="13" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="204.16" y="638" fill="#95b9c1" font-size="12" font-weight="500" opacity="1" class="iv-d-mono">terraform destroy</text></g><text x="60" y="672" fill="#95b9c1" font-size="11.5" font-weight="600" opacity="1">runs through the harness's normal permission flow — documented so the gap is explicit, never implied</text><text x="575" y="729" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" text-anchor="middle">blocked is not denied forever — every refusal carries its reason, and expansion is gated one oracle at a time</text>
</svg>
