<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="pm-l-t pm-l-d"><title id="pm-l-t">Counterstep process</title><desc id="pm-l-d">The deny-until-armed handshake, narrow composition: intercept, fingerprint, construct, rehearse, arm and release; ops with no oracle are denied with the reason stated.</desc>
<defs>
<linearGradient id="pm-l-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#308078"/><stop offset="0.55" stop-color="#48799d"/><stop offset="1" stop-color="#577c6b"/></linearGradient>
<radialGradient id="pm-l-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#308078" stop-opacity="0.09"/><stop offset="1" stop-color="#f9fefe" stop-opacity="0"/></radialGradient>
<filter id="pm-l-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="pm-l-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#308078" stroke-width="1.6"/></marker>
<marker id="pm-l-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557a84" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.pm-l-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.pm-l-flow{animation:pm-l-fdash 5.5s linear infinite}@keyframes pm-l-fdash{to{stroke-dashoffset:-190}}.pm-l-pulse{animation:pm-l-fpulse 4.2s ease-in-out infinite}@keyframes pm-l-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="640" height="1010" rx="16" fill="#f9fefe"/>
<rect width="640" height="1010" rx="16" fill="url(#pm-l-halo)"/>
<pattern id="pm-l-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#cbf7f3" stroke-opacity="0.55" stroke-width="0.6"/></pattern>
<rect width="640" height="1010" rx="16" fill="url(#pm-l-grid)"/>
<text x="36" y="44" fill="#132a2e" font-size="23" font-weight="700" opacity="1">Fingerprint, rehearse, arm</text><text x="36" y="68" fill="#557a84" font-size="13.5" font-weight="400" opacity="1">One destructive call, from interception to an armed undo</text><rect x="36" y="100" width="568" height="118" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="134" fill="#308078" font-size="14" font-weight="700" opacity="1" class="pm-l-mono">01</text><text x="88" y="134" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Intercept</text><text x="54" y="164" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">PreToolUse payload over Bash, Write,</text><text x="54" y="184" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">Edit, MultiEdit, NotebookEdit</text><path d="M320 218 L320 252" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pm-l-arrow)" class="pm-l-flow"/><rect x="36" y="252" width="568" height="118" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="286" fill="#308078" font-size="14" font-weight="700" opacity="1" class="pm-l-mono">02</text><text x="88" y="286" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Fingerprint</text><text x="54" y="316" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">sha256 of the affected state: recursive</text><text x="54" y="336" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">fs content, or the remote ref's target</text><path d="M320 370 L320 404" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pm-l-arrow)" class="pm-l-flow"/><rect x="36" y="404" width="568" height="118" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="438" fill="#308078" font-size="14" font-weight="700" opacity="1" class="pm-l-mono">03</text><text x="88" y="438" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Construct the inverse</text><text x="54" y="468" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">fs_restore — shadow snapshot of paths;</text><text x="54" y="488" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">git_push_ref — force-with-lease rewind</text><path d="M320 522 L320 556" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pm-l-arrow)" class="pm-l-flow"/><rect x="36" y="556" width="568" height="118" rx="12" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="54" y="590" fill="#308078" font-size="14" font-weight="700" opacity="1" class="pm-l-mono">04</text><text x="88" y="590" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Shadow rehearsal</text><text x="54" y="620" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">inverse applied to a shadow copy; it must</text><text x="54" y="640" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">drive the fingerprint back to the armed value</text><rect x="36" y="556" width="4" height="118" rx="2" fill="#308078"/><path d="M320 674 L320 708" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pm-l-arrow)" class="pm-l-flow"/><rect x="36" y="708" width="568" height="118" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="742" fill="#308078" font-size="14" font-weight="700" opacity="1" class="pm-l-mono">05</text><text x="88" y="742" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Arm &amp; release</text><text x="54" y="772" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">artifact appended to ledger.jsonl, then —</text><text x="54" y="792" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">and only then — the forward call runs</text><rect x="36" y="860" width="568" height="118" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="894" fill="#48799d" font-size="14" font-weight="700" opacity="1" class="pm-l-mono">BLOCKED — no oracle, denied with reason</text><text x="54" y="924" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">globs · outside workspace · git reset --hard ·</text><text x="54" y="944" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">third-party HTTP writes — docs/invertibility.md</text><path d="M320 826 L320 860" fill="none" stroke="#557a84" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pm-l-arrowm)" class="pm-l-flow"/><rect x="36" y="1008" width="568" height="64" rx="10" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="320" y="1035" fill="#132a2e" font-size="13.5" font-weight="600" opacity="1" text-anchor="middle">non-destructive calls pass through untouched</text><text x="320" y="1057" fill="#557a84" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">only the destructive class is intercepted</text>
</svg>
