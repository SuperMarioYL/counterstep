<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1150" viewBox="0 0 640 1150" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="am-l-t am-l-d"><title id="am-l-t">Counterstep architecture</title><desc id="am-l-d">How Counterstep is built, narrow composition: session, hook modules, .counterstep state directory, developer ledger commands and the four artifact statuses.</desc>
<defs>
<linearGradient id="am-l-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#308078"/><stop offset="0.55" stop-color="#48799d"/><stop offset="1" stop-color="#577c6b"/></linearGradient>
<radialGradient id="am-l-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#308078" stop-opacity="0.09"/><stop offset="1" stop-color="#f9fefe" stop-opacity="0"/></radialGradient>
<filter id="am-l-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="am-l-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#308078" stroke-width="1.6"/></marker>
<marker id="am-l-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557a84" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.am-l-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.am-l-flow{animation:am-l-fdash 5.5s linear infinite}@keyframes am-l-fdash{to{stroke-dashoffset:-190}}.am-l-pulse{animation:am-l-fpulse 4.2s ease-in-out infinite}@keyframes am-l-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="640" height="1150" rx="16" fill="#f9fefe"/>
<rect width="640" height="1150" rx="16" fill="url(#am-l-halo)"/>
<pattern id="am-l-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#cbf7f3" stroke-opacity="0.55" stroke-width="0.6"/></pattern>
<rect width="640" height="1150" rx="16" fill="url(#am-l-grid)"/>
<text x="36" y="44" fill="#132a2e" font-size="23" font-weight="700" opacity="1">One CLI, state is a directory</text><text x="36" y="68" fill="#557a84" font-size="13.5" font-weight="400" opacity="1">Zero daemons, no database — one process per hook invocation</text><rect x="36" y="100" width="568" height="108" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="134" fill="#132a2e" font-size="16" font-weight="700" opacity="1">Claude Code session</text><text x="54" y="162" fill="#48799d" font-size="12.5" font-weight="600" opacity="1" class="am-l-mono">PreToolUse · stdin JSON</text><text x="54" y="186" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" class="am-l-mono">Bash · Write · Edit · MultiEdit · NotebookEdit</text><path d="M320 208 L320 242" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#am-l-arrow)" class="am-l-flow"/><rect x="36" y="242" width="568" height="270" rx="14" fill="#f7fefd" stroke="url(#am-l-brand)" stroke-width="1.8"/><text x="54" y="274" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">counterstep hook</text><text x="54" y="296" fill="#557a84" font-size="12" font-weight="600" opacity="1">one process per call</text><rect x="54" y="312" width="532" height="28" rx="8" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="66" y="331" fill="#308078" font-size="11.5" font-weight="600" opacity="1" class="am-l-mono">classify</text><text x="574" y="331" fill="#557a84" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">destructive class?</text><rect x="54" y="350" width="532" height="28" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="66" y="369" fill="#132a2e" font-size="11.5" font-weight="600" opacity="1" class="am-l-mono">adapters/claude_code.ts</text><text x="574" y="369" fill="#557a84" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">stdio hook handler</text><rect x="54" y="388" width="532" height="28" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="66" y="407" fill="#132a2e" font-size="11.5" font-weight="600" opacity="1" class="am-l-mono">compensation.ts</text><text x="574" y="407" fill="#557a84" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">build the inverse</text><rect x="54" y="426" width="532" height="28" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="66" y="445" fill="#132a2e" font-size="11.5" font-weight="600" opacity="1" class="am-l-mono">fingerprint.ts</text><text x="574" y="445" fill="#557a84" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">sha256 oracle</text><rect x="54" y="464" width="532" height="28" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="66" y="483" fill="#132a2e" font-size="11.5" font-weight="600" opacity="1" class="am-l-mono">rehearse.ts</text><text x="574" y="483" fill="#557a84" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">shadow-copy proof</text><path d="M320 512 L320 546" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#am-l-arrow)" class="am-l-flow"/><rect x="36" y="546" width="568" height="116" rx="12" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="54" y="578" fill="#308078" font-size="15.5" font-weight="700" opacity="1" class="am-l-mono">.counterstep/</text><text x="54" y="606" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" class="am-l-mono">ledger.jsonl — append-only armed inverses</text><text x="54" y="630" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" class="am-l-mono">shadow/&lt;artifact-id&gt;/ rehearsal payloads</text><path d="M320 662 L320 696" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#am-l-arrow)" class="am-l-flow"/><rect x="36" y="696" width="568" height="100" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="54" y="728" fill="#132a2e" font-size="15.5" font-weight="700" opacity="1">developer</text><text x="54" y="756" fill="#308078" font-size="12.5" font-weight="600" opacity="1" class="am-l-mono">counterstep ledger · counterstep fire --last</text><text x="54" y="780" fill="#557a84" font-size="12" font-weight="600" opacity="1">verify fingerprint, execute the inverse</text><rect x="36" y="830" width="568" height="58" rx="9" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="52" y="855" fill="#308078" font-size="13.5" font-weight="700" opacity="1" class="am-l-mono">armed</text><text x="52" y="876" fill="#557a84" font-size="12" font-weight="600" opacity="1">rehearsal passed, call released</text><rect x="36" y="904" width="568" height="58" rx="9" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="52" y="929" fill="#132a2e" font-size="13.5" font-weight="700" opacity="1" class="am-l-mono">fired</text><text x="52" y="950" fill="#557a84" font-size="12" font-weight="600" opacity="1">undo executed, fingerprint matches</text><rect x="36" y="978" width="568" height="58" rx="9" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="52" y="1003" fill="#132a2e" font-size="13.5" font-weight="700" opacity="1" class="am-l-mono">stale</text><text x="52" y="1024" fill="#557a84" font-size="12" font-weight="600" opacity="1">live state drifted — inspect first</text><rect x="36" y="1052" width="568" height="58" rx="9" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="52" y="1077" fill="#132a2e" font-size="13.5" font-weight="700" opacity="1" class="am-l-mono">failed</text><text x="52" y="1098" fill="#557a84" font-size="12" font-weight="600" opacity="1">inverse could not run; remote untouched</text><text x="320" y="1162" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" text-anchor="middle">firing re-verifies the fingerprint — drift is surfaced, never silently clobbered</text>
</svg>
