<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1150" viewBox="0 0 640 1150" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="am-d-t am-d-d"><title id="am-d-t">Counterstep architecture</title><desc id="am-d-d">How Counterstep is built, narrow composition: session, hook modules, .counterstep state directory, developer ledger commands and the four artifact statuses.</desc>
<defs>
<linearGradient id="am-d-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56e6d7"/><stop offset="0.55" stop-color="#6ab1e7"/><stop offset="1" stop-color="#acf6d4"/></linearGradient>
<radialGradient id="am-d-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#56e6d7" stop-opacity="0.16"/><stop offset="1" stop-color="#050c11" stop-opacity="0"/></radialGradient>
<filter id="am-d-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="am-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e6d7" stroke-width="1.6"/></marker>
<marker id="am-d-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9c1" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.am-d-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.am-d-flow{animation:am-d-fdash 5.5s linear infinite}@keyframes am-d-fdash{to{stroke-dashoffset:-190}}.am-d-pulse{animation:am-d-fpulse 4.2s ease-in-out infinite}@keyframes am-d-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="640" height="1150" rx="16" fill="#050c11"/>
<rect width="640" height="1150" rx="16" fill="url(#am-d-halo)"/>
<pattern id="am-d-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#173c3d" stroke-opacity="0.3" stroke-width="0.6"/></pattern>
<rect width="640" height="1150" rx="16" fill="url(#am-d-grid)"/>
<text x="36" y="44" fill="#eefdf6" font-size="23" font-weight="700" opacity="1">One CLI, state is a directory</text><text x="36" y="68" fill="#95b9c1" font-size="13.5" font-weight="400" opacity="1">Zero daemons, no database — one process per hook invocation</text><rect x="36" y="100" width="568" height="108" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="54" y="134" fill="#eefdf6" font-size="16" font-weight="700" opacity="1">Claude Code session</text><text x="54" y="162" fill="#6ab1e7" font-size="12.5" font-weight="600" opacity="1" class="am-d-mono">PreToolUse · stdin JSON</text><text x="54" y="186" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" class="am-d-mono">Bash · Write · Edit · MultiEdit · NotebookEdit</text><path d="M320 208 L320 242" fill="none" stroke="#56e6d7" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#am-d-arrow)" class="am-d-flow"/><rect x="36" y="242" width="568" height="270" rx="14" fill="#0c171e" stroke="url(#am-d-brand)" stroke-width="1.8"/><text x="54" y="274" fill="#eefdf6" font-size="16.5" font-weight="700" opacity="1">counterstep hook</text><text x="54" y="296" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">one process per call</text><rect x="54" y="312" width="532" height="28" rx="8" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><text x="66" y="331" fill="#56e6d7" font-size="11.5" font-weight="600" opacity="1" class="am-d-mono">classify</text><text x="574" y="331" fill="#95b9c1" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">destructive class?</text><rect x="54" y="350" width="532" height="28" rx="8" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="369" fill="#eefdf6" font-size="11.5" font-weight="600" opacity="1" class="am-d-mono">adapters/claude_code.ts</text><text x="574" y="369" fill="#95b9c1" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">stdio hook handler</text><rect x="54" y="388" width="532" height="28" rx="8" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="407" fill="#eefdf6" font-size="11.5" font-weight="600" opacity="1" class="am-d-mono">compensation.ts</text><text x="574" y="407" fill="#95b9c1" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">build the inverse</text><rect x="54" y="426" width="532" height="28" rx="8" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="445" fill="#eefdf6" font-size="11.5" font-weight="600" opacity="1" class="am-d-mono">fingerprint.ts</text><text x="574" y="445" fill="#95b9c1" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">sha256 oracle</text><rect x="54" y="464" width="532" height="28" rx="8" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="66" y="483" fill="#eefdf6" font-size="11.5" font-weight="600" opacity="1" class="am-d-mono">rehearse.ts</text><text x="574" y="483" fill="#95b9c1" font-size="10.5" font-weight="600" opacity="1" text-anchor="end">shadow-copy proof</text><path d="M320 512 L320 546" fill="none" stroke="#56e6d7" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#am-d-arrow)" class="am-d-flow"/><rect x="36" y="546" width="568" height="116" rx="12" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><text x="54" y="578" fill="#56e6d7" font-size="15.5" font-weight="700" opacity="1" class="am-d-mono">.counterstep/</text><text x="54" y="606" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" class="am-d-mono">ledger.jsonl — append-only armed inverses</text><text x="54" y="630" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" class="am-d-mono">shadow/&lt;artifact-id&gt;/ rehearsal payloads</text><path d="M320 662 L320 696" fill="none" stroke="#56e6d7" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#am-d-arrow)" class="am-d-flow"/><rect x="36" y="696" width="568" height="100" rx="12" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="54" y="728" fill="#eefdf6" font-size="15.5" font-weight="700" opacity="1">developer</text><text x="54" y="756" fill="#56e6d7" font-size="12.5" font-weight="600" opacity="1" class="am-d-mono">counterstep ledger · counterstep fire --last</text><text x="54" y="780" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">verify fingerprint, execute the inverse</text><rect x="36" y="830" width="568" height="58" rx="9" fill="#0c171e" stroke="#56e6d7" stroke-width="1.7"/><text x="52" y="855" fill="#56e6d7" font-size="13.5" font-weight="700" opacity="1" class="am-d-mono">armed</text><text x="52" y="876" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">rehearsal passed, call released</text><rect x="36" y="904" width="568" height="58" rx="9" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="52" y="929" fill="#eefdf6" font-size="13.5" font-weight="700" opacity="1" class="am-d-mono">fired</text><text x="52" y="950" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">undo executed, fingerprint matches</text><rect x="36" y="978" width="568" height="58" rx="9" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="52" y="1003" fill="#eefdf6" font-size="13.5" font-weight="700" opacity="1" class="am-d-mono">stale</text><text x="52" y="1024" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">live state drifted — inspect first</text><rect x="36" y="1052" width="568" height="58" rx="9" fill="#0c171e" stroke="#173c3d" stroke-width="1.1"/><text x="52" y="1077" fill="#eefdf6" font-size="13.5" font-weight="700" opacity="1" class="am-d-mono">failed</text><text x="52" y="1098" fill="#95b9c1" font-size="12" font-weight="600" opacity="1">inverse could not run; remote untouched</text><text x="320" y="1162" fill="#95b9c1" font-size="12.5" font-weight="600" opacity="1" text-anchor="middle">firing re-verifies the fingerprint — drift is surfaced, never silently clobbered</text>
</svg>
