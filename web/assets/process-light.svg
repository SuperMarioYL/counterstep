<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="668" viewBox="0 0 1150 668" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="pc-l-t pc-l-d"><title id="pc-l-t">Counterstep process</title><desc id="pc-l-d">The deny-until-armed handshake: intercept the destructive call, fingerprint the state, construct the inverse, rehearse on a shadow copy, then arm and release; ops with no oracle are denied with the reason stated.</desc>
<defs>
<linearGradient id="pc-l-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#308078"/><stop offset="0.55" stop-color="#48799d"/><stop offset="1" stop-color="#577c6b"/></linearGradient>
<radialGradient id="pc-l-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#308078" stop-opacity="0.09"/><stop offset="1" stop-color="#f9fefe" stop-opacity="0"/></radialGradient>
<filter id="pc-l-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="pc-l-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#308078" stroke-width="1.6"/></marker>
<marker id="pc-l-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557a84" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.pc-l-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.pc-l-flow{animation:pc-l-fdash 5.5s linear infinite}@keyframes pc-l-fdash{to{stroke-dashoffset:-190}}.pc-l-pulse{animation:pc-l-fpulse 4.2s ease-in-out infinite}@keyframes pc-l-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="1150" height="668" rx="16" fill="#f9fefe"/>
<rect width="1150" height="668" rx="16" fill="url(#pc-l-halo)"/>
<pattern id="pc-l-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#cbf7f3" stroke-opacity="0.55" stroke-width="0.6"/></pattern>
<rect width="1150" height="668" rx="16" fill="url(#pc-l-grid)"/>
<text x="40" y="46" fill="#132a2e" font-size="23" font-weight="700" opacity="1">Fingerprint, rehearse, arm</text><text x="40" y="70" fill="#557a84" font-size="13.5" font-weight="400" opacity="1">One destructive call, from interception to an armed undo — typically seconds</text><rect x="40" y="118" width="320" height="148" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="60" y="154" fill="#308078" font-size="15" font-weight="700" opacity="1" class="pc-l-mono">01</text><text x="98" y="154" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Intercept</text><text x="60" y="186" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">PreToolUse payload over Bash, Write,</text><text x="60" y="206" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">Edit, MultiEdit, NotebookEdit</text><rect x="415" y="118" width="320" height="148" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="435" y="154" fill="#308078" font-size="15" font-weight="700" opacity="1" class="pc-l-mono">02</text><text x="473" y="154" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Fingerprint</text><text x="435" y="186" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">sha256 of the affected state: recursive</text><text x="435" y="206" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">fs content, or the remote ref's target</text><rect x="790" y="118" width="320" height="148" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="810" y="154" fill="#308078" font-size="15" font-weight="700" opacity="1" class="pc-l-mono">03</text><text x="848" y="154" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Construct the inverse</text><text x="810" y="186" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">fs_restore — shadow snapshot of paths;</text><text x="810" y="206" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">git_push_ref — force-with-lease rewind</text><rect x="810" y="356" width="300" height="148" rx="12" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="830" y="392" fill="#308078" font-size="15" font-weight="700" opacity="1" class="pc-l-mono">04</text><text x="868" y="392" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Shadow rehearsal</text><text x="830" y="424" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">inverse applied to a shadow copy; it must</text><text x="830" y="444" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">drive the fingerprint back to the armed value</text><rect x="810" y="356" width="4" height="148" rx="2" fill="#308078"/><rect x="415" y="356" width="320" height="148" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="435" y="392" fill="#308078" font-size="15" font-weight="700" opacity="1" class="pc-l-mono">05</text><text x="473" y="392" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">Arm &amp; release</text><text x="435" y="424" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">artifact appended to ledger.jsonl, then —</text><text x="435" y="444" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">and only then — the forward call runs</text><path d="M360 192 L415 192" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pc-l-arrow)" class="pc-l-flow"/><path d="M735 192 L790 192" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pc-l-arrow)" class="pc-l-flow"/><path d="M950 266 L950 356" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pc-l-arrow)" class="pc-l-flow"/><path d="M810 430 L735 430" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pc-l-arrow)" class="pc-l-flow"/><text x="772" y="402" fill="#308078" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">rehearsal</text><text x="772" y="418" fill="#308078" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">passed</text><path d="M960 504 L960 536 L190 536 L190 510" fill="none" stroke="#557a84" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pc-l-arrowm)" class="pc-l-flow"/><text x="575" y="556" fill="#557a84" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">no oracle — reason stated</text><rect x="40" y="356" width="320" height="148" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="60" y="392" fill="#48799d" font-size="15" font-weight="700" opacity="1" class="pc-l-mono">BLOCKED</text><text x="60" y="424" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">globs · outside workspace · git reset --hard ·</text><text x="60" y="444" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">third-party HTTP writes — the denial carries</text><text x="60" y="464" fill="#557a84" font-size="12.5" font-weight="400" opacity="1">the reason (docs/invertibility.md)</text><rect x="40" y="566" width="1070" height="62" rx="10" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><path d="M80 597 L1040 597" fill="none" stroke="#557a84" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#pc-l-arrowm)" class="pc-l-flow"/><text x="575" y="590" fill="#132a2e" font-size="13.5" font-weight="600" opacity="1" text-anchor="middle">non-destructive calls pass through untouched</text><text x="575" y="614" fill="#557a84" font-size="11.5" font-weight="600" opacity="1" text-anchor="middle">only the destructive class is intercepted</text>
</svg>
