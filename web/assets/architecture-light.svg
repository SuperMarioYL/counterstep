<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="668" viewBox="0 0 1150 668" data-palette="56e6d7-6ab1e7-acf6d4-6f9a007a410e" role="img" aria-labelledby="ar-l-t ar-l-d"><title id="ar-l-t">Counterstep architecture</title><desc id="ar-l-d">How Counterstep is built: the Claude Code PreToolUse hook feeds a single-process CLI with classify, adapter, compensation, fingerprint and rehearsal modules, state kept in a .counterstep directory with an append-only JSONL ledger and shadow store.</desc>
<defs>
<linearGradient id="ar-l-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#308078"/><stop offset="0.55" stop-color="#48799d"/><stop offset="1" stop-color="#577c6b"/></linearGradient>
<radialGradient id="ar-l-halo" cx="0.5" cy="0.32" r="0.9"><stop stop-color="#308078" stop-opacity="0.09"/><stop offset="1" stop-color="#f9fefe" stop-opacity="0"/></radialGradient>
<filter id="ar-l-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ar-l-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#308078" stroke-width="1.6"/></marker>
<marker id="ar-l-arrowm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557a84" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.ar-l-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.ar-l-flow{animation:ar-l-fdash 5.5s linear infinite}@keyframes ar-l-fdash{to{stroke-dashoffset:-190}}.ar-l-pulse{animation:ar-l-fpulse 4.2s ease-in-out infinite}@keyframes ar-l-fpulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="1150" height="668" rx="16" fill="#f9fefe"/>
<rect width="1150" height="668" rx="16" fill="url(#ar-l-halo)"/>
<pattern id="ar-l-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#cbf7f3" stroke-opacity="0.55" stroke-width="0.6"/></pattern>
<rect width="1150" height="668" rx="16" fill="url(#ar-l-grid)"/>
<text x="40" y="46" fill="#132a2e" font-size="23" font-weight="700" opacity="1">One CLI, state is a directory</text><text x="40" y="70" fill="#557a84" font-size="13.5" font-weight="400" opacity="1">Zero daemons, no database — one process per hook invocation, append-only JSONL</text><rect x="40" y="128" width="300" height="190" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="60" y="160" fill="#132a2e" font-size="16" font-weight="700" opacity="1">Claude Code session</text><text x="60" y="190" fill="#48799d" font-size="12.5" font-weight="600" opacity="1" class="ar-l-mono">PreToolUse · stdin JSON</text><text x="60" y="216" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" class="ar-l-mono">Bash · Write · Edit</text><text x="60" y="238" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" class="ar-l-mono">MultiEdit · NotebookEdit</text><text x="60" y="272" fill="#557a84" font-size="12" font-weight="600" opacity="1">every destructive call passes</text><text x="60" y="290" fill="#557a84" font-size="12" font-weight="600" opacity="1">the hook before it runs</text><rect x="420" y="128" width="340" height="304" rx="14" fill="#f7fefd" stroke="url(#ar-l-brand)" stroke-width="1.8"/><text x="440" y="160" fill="#132a2e" font-size="16.5" font-weight="700" opacity="1">counterstep hook</text><text x="440" y="182" fill="#557a84" font-size="12" font-weight="600" opacity="1">one process per call</text><rect x="440" y="208" width="300" height="32" rx="8" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="452" y="229" fill="#308078" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">classify</text><text x="728" y="229" fill="#557a84" font-size="11" font-weight="600" opacity="1" text-anchor="end">destructive class?</text><rect x="440" y="250" width="300" height="32" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="452" y="271" fill="#132a2e" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">adapters/claude_code.ts</text><text x="728" y="271" fill="#557a84" font-size="11" font-weight="600" opacity="1" text-anchor="end">stdio hook handler</text><rect x="440" y="292" width="300" height="32" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="452" y="313" fill="#132a2e" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">compensation.ts</text><text x="728" y="313" fill="#557a84" font-size="11" font-weight="600" opacity="1" text-anchor="end">build the inverse</text><rect x="440" y="334" width="300" height="32" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="452" y="355" fill="#132a2e" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">fingerprint.ts</text><text x="728" y="355" fill="#557a84" font-size="11" font-weight="600" opacity="1" text-anchor="end">sha256 oracle</text><rect x="440" y="376" width="300" height="32" rx="8" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="452" y="397" fill="#132a2e" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">rehearse.ts</text><text x="728" y="397" fill="#557a84" font-size="11" font-weight="600" opacity="1" text-anchor="end">shadow-copy proof</text><rect x="840" y="128" width="270" height="150" rx="12" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="858" y="158" fill="#308078" font-size="15.5" font-weight="700" opacity="1" class="ar-l-mono">.counterstep/</text><text x="858" y="186" fill="#557a84" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">ledger.jsonl — append-only</text><text x="858" y="208" fill="#557a84" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">shadow/&lt;artifact-id&gt;/</text><text x="858" y="236" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">armed inverses + shadow</text><text x="858" y="254" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">rehearsal payloads</text><rect x="840" y="318" width="270" height="114" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="858" y="348" fill="#132a2e" font-size="15.5" font-weight="700" opacity="1">developer</text><text x="858" y="376" fill="#132a2e" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">counterstep ledger</text><text x="858" y="398" fill="#308078" font-size="12" font-weight="600" opacity="1" class="ar-l-mono">counterstep fire --last</text><text x="858" y="420" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">verify fingerprint, execute</text><path d="M340 200 L420 200" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#ar-l-arrow)" class="ar-l-flow"/><text x="380" y="188" fill="#557a84" font-size="11" font-weight="600" opacity="1" text-anchor="middle" class="ar-l-mono">stdin</text><path d="M760 200 L840 200" fill="none" stroke="#308078" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#ar-l-arrow)" class="ar-l-flow"/><text x="800" y="188" fill="#308078" font-size="11" font-weight="600" opacity="1" text-anchor="middle" class="ar-l-mono">armed</text><path d="M975 318 L975 286" fill="none" stroke="#557a84" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#ar-l-arrowm)" class="ar-l-flow"/><text x="992" y="306" fill="#557a84" font-size="11" font-weight="600" opacity="1" class="ar-l-mono">ledger · fire</text><rect x="40" y="500" width="1070" height="128" rx="12" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><rect x="64" y="522" width="238" height="40" rx="9" fill="#f7fefd" stroke="#308078" stroke-width="1.7"/><text x="78" y="547" fill="#308078" font-size="13" font-weight="700" opacity="1" class="ar-l-mono">armed</text><text x="64" y="590" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">rehearsal passed, call released</text><rect x="326" y="522" width="238" height="40" rx="9" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="340" y="547" fill="#132a2e" font-size="13" font-weight="700" opacity="1" class="ar-l-mono">fired</text><text x="326" y="590" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">undo executed, fingerprint matches</text><rect x="588" y="522" width="238" height="40" rx="9" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="602" y="547" fill="#132a2e" font-size="13" font-weight="700" opacity="1" class="ar-l-mono">stale</text><text x="588" y="590" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">live state drifted — inspect first</text><rect x="850" y="522" width="238" height="40" rx="9" fill="#f7fefd" stroke="#cbf7f3" stroke-width="1.1"/><text x="864" y="547" fill="#132a2e" font-size="13" font-weight="700" opacity="1" class="ar-l-mono">failed</text><text x="850" y="590" fill="#557a84" font-size="11.5" font-weight="600" opacity="1">inverse could not run; remote untouched</text><text x="575" y="640" fill="#557a84" font-size="12.5" font-weight="600" opacity="1" text-anchor="middle">firing re-verifies the fingerprint — drift is surfaced, never silently clobbered</text>
</svg>
